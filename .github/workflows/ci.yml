name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The plugin is developed on Windows and DSH also runs on macOS/Linux;
        # both a POSIX and a Windows run must stay green.
        os: [ubuntu-latest, windows-latest]
        # engines.node declares >=20: the floor (20) must stay green because a
        # user may legitimately run it, 22 is the development line, and 24 is
        # the current LTS. If 20 ever breaks, the honest fix is compat code or
        # raising engines — never dropping the floor from the matrix silently.
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm test` runs lint.mjs first — a syntax gate over every shipped and
      # repo-run file (node --check, no ESLint by design) — then
      # host-range-test.mjs, which pins the declared DSH compatibility range
      # against a fixed version matrix under BOTH npm's default prerelease
      # semantics and `includePrerelease: true`, plus a LIVE guard over
      # whatever host is installed here.
      #
      # Those two modes disagreeing on the installed host is exactly how the
      # false negatives shipped unnoticed — dshmarket reads the range with
      # `includePrerelease: true` and said "compatible" while plain semver said
      # "incompatible" for the same version. It happened twice: 0.1.6-alpha.2
      # (fixed in 1.0.8) and 0.1.7-rc.2 (fixed in 1.0.9), because the range
      # enumerates prerelease tuples one minor at a time and each new minor
      # needs its own segment.
      - run: npm test
      - run: node check-metadata.mjs

  # The suite above installs no dependencies and resolves `semver` from the
  # machine. Guard the range on the semver versions the ecosystem actually
  # evaluates with, so a change in npm's gate handling cannot slip through on
  # a runner that happens to resolve a different implementation.
  host-range:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        semver: ['7.6.0', '7.8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save semver@${{ matrix.semver }}
      - run: node host-range-test.mjs
