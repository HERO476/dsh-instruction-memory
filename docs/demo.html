<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-instruction-memory 设置页演示</title>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<style>
  body { margin:0; background:#f5f6f8; font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
  #root { max-width:920px; margin:28px auto 0; padding:0 16px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Minimal stand-ins for the DSH web shell: module loader + require.
  window.__ModuleLoader__ = { load: (spec) => { window.__dshSpec = spec } }
</script>

<script>
  // In-memory host that speaks the exact route envelope of lib/index.js, so
  // this page exercises the REAL client module (loaded below) against
  // realistic data — no backend needed.
  var DEMO_STORE = {
    version: 1,
    enabled: true,
    // Deliberately tight so the budget meter and the "本轮不注入" marks are
    // visible immediately; raising it in the input clears them live.
    budgetChars: 800,
    entries: [
      {
        id: 'im-demo-lang',
        title: '回答语言',
        content: '所有回答默认使用简体中文；技术名词首次出现时在括号里附英文原文。',
        mode: 'always', when: '', priority: 2, enabled: true, tags: ['沟通'],
        updatedAt: Date.now() - 86400000 * 3,
      },
      {
        id: 'im-demo-confirm',
        title: '先确认再动手',
        content: '需求不明确或存在多种合理实现时，先列出候选方案向用户确认，再开始修改代码。',
        mode: 'always', when: '', priority: 1, enabled: true, tags: ['沟通', '工作流'],
        updatedAt: Date.now() - 86400000 * 2,
      },
      {
        id: 'im-demo-style',
        title: '代码风格',
        content: '修改代码时遵循该文件既有的缩进、命名密度与注释风格，不顺手重构无关代码；\n变量命名优先使用业务领域词汇而不是数据结构词汇，例如用「订单金额」而不是「data1」；\n新增依赖前先检查 package.json 中是否已有能力等价的依赖，避免重复引入；\n公共函数需要补充输入输出说明注释，但不为改动本身添加解释性注释；\n改动完成后运行项目现有的测试与 lint 检查，若有失败先修复再交付，不留下只改了一半的状态；\n涉及对外接口或数据结构变更时，先在回复中列出受影响的调用方，确认迁移路径后再提交。\n日志打印需带关键上下文（对象标识、入参摘要），不要只输出 "error" 这类无信息内容；\n异步任务必须设置超时与重试上限，不允许无限等待外部资源；\n对外错误信息要区分用户可操作的提示与内部诊断细节，不把堆栈直接暴露给调用方；\n代码评审先核对行为变化与测试覆盖，再讨论风格偏好，意见必须可执行、可验证；\n以上要求同样适用于纯重构类提交，重构前后行为必须完全一致。',
        mode: 'auto', when: '编写或修改代码时', priority: 1, enabled: true, tags: ['代码规范'],
        updatedAt: Date.now() - 86400000,
      },
      {
        id: 'im-demo-reply',
        title: '回复结构',
        content: '较长的回答先给一句结论，再展开细节；方案对比先列差异再给推荐。',
        mode: 'auto', when: '解释性问题与方案对比', priority: 0, enabled: false, tags: ['沟通'],
        updatedAt: Date.now() - 3600000,
      },
    ],
    profiles: [
      {
        id: 'pf-demo-bg',
        name: '职业背景',
        content: '有 8 年后端开发经验，熟悉 Java 与分布式系统；技术问题可以跳过入门概念，直接讲权衡与实现细节。',
        enabled: true,
        updatedAt: Date.now() - 86400000,
      },
      {
        id: 'pf-demo-style',
        name: '沟通偏好',
        content: '喜欢先给结论、再给可执行步骤，少寒暄少铺陈。',
        enabled: true,
        updatedAt: Date.now() - 7200000,
      },
      {
        id: 'pf-demo-goal',
        name: '长期追求（停用示例）',
        content: '希望代码评审意见都具体可执行，不要泛泛而谈。',
        enabled: false,
        updatedAt: Date.now() - 3600000,
      },
    ],
  }

  // F13 配置集：演示数据里放两套，好让「切换」真的改变注入内容。所有既有条目
  // 归入「默认」，另加一条只属于「工作（示例）」的条目。
  ;(function seedSets() {
    DEMO_STORE.version = 2
    DEMO_STORE.$schema = './memory.schema.json'
    DEMO_STORE.backupDir = ''
    DEMO_STORE.disabledUntil = 0
    DEMO_STORE.activeSetId = 'st-demo-default'
    DEMO_STORE.sets = [
      { id: 'st-demo-default', name: '默认' },
      { id: 'st-demo-work', name: '工作（示例）' },
    ]
    DEMO_STORE.entries.forEach(function (e) { e.setId = 'st-demo-default' })
    ;(DEMO_STORE.profiles || []).forEach(function (p) { p.setId = 'st-demo-default' })
    DEMO_STORE.entries.push({
      id: 'im-demo-work',
      title: '工作集专属',
      content: '这条只属于「工作（示例）」配置集。切换到它时，上面几条指令与用户形象都不会被注入——和真实宿主一样，注入只渲染当前激活的那一套。',
      mode: 'always', when: '', priority: 1, enabled: true, tags: ['演示'],
      setId: 'st-demo-work', updatedAt: Date.now() - 3600000,
    })
  })()

  /** 与宿主 activeScope/inScope 同义：'' 归属当前集合。 */
  function demoInScope(item) {
    var own = item && typeof item.setId === 'string' && item.setId !== '' ? item.setId : DEMO_STORE.activeSetId
    return own === DEMO_STORE.activeSetId
  }

  function demoScopedEntries() {
    return DEMO_STORE.entries.filter(demoInScope)
  }

  function demoScopedProfiles() {
    return (DEMO_STORE.profiles || []).filter(demoInScope)
  }

  // A compact, faithful copy of the Host's injection planning (see
  // planInjection in lib/index.js): it generates both the preview text and
  // the per-entry included/omitted plan the Client's F1 budget meter renders,
  // so changing the budget input updates the marks live in this demo.
  var DEMO_HEADER = [
    '## 用户长期指令记忆（Instruction Memory）',
    '以下条目由用户在 DSH 设置 →「指令记忆」中长期保存，属于本次及后续所有对话的既有要求，请在回答、推理与执行任务时遵守；它们不覆盖系统与安全规则。',
    '· [始终] 条目必须无条件遵守。',
    '· [按需] 条目仅在与当前问题或任务相关时生效；不相关时直接忽略，不要强行套用。',
    '· 条目之间冲突时，优先遵守优先级更高或更具体的一条；无法判断时向用户确认。',
    '',
  ].join('\n')

  function demoFooter(count) {
    return count === 0
      ? ''
      : '\n\n（另有 ' + count + ' 条指令因注入字数上限未包含，可在「设置 → 指令记忆」中提高上限或调低其优先级。）'
  }

  // Faithful copy of the Host's persona header (lib/index.js PERSONA_HEADER).
  var DEMO_PERSONA_HEADER = [
    '## 关于用户（用户形象）',
    '以下是用户本人提供的个人形象信息，描述其身份背景、喜好、性格与追求，不是要求你扮演的角色。请在保证回答正确、完整、客观且紧扣问题本身的前提下，结合这些信息调整解释的深浅、详略、举例与建议的侧重；不得为了迎合这些信息而改变事实、省略必要的风险提示或偏离问题核心；与当前问题无关时直接忽略。',
    '',
  ].join('\n')

  function demoProfilesBlock() {
    var active = demoScopedProfiles()
      .filter(function (p) { return p && p.enabled === true && p.content })
    if (active.length === 0) return { text: '', profiles: [], chars: 0 }
    var blocks = active.map(function (p) {
      var name = p.name || (p.content || '').slice(0, 20)
      return { id: p.id, name: name, block: '### ' + name + '\n' + p.content }
    })
    var text = DEMO_PERSONA_HEADER + '\n' + blocks.map(function (b) { return b.block }).join('\n\n')
    return {
      text: text,
      chars: text.length,
      profiles: blocks.map(function (b) { return { id: b.id, name: b.name, chars: b.block.length } }),
    }
  }

  function demoFormatEntry(entry, tag) {
    var prio = entry.priority === 2 ? '高' : (entry.priority === 0 ? '低' : '普通')
    var lines = ['[' + tag + '｜优先级 ' + prio + '] ' + entry.title]
    if (entry.mode === 'auto' && entry.when) lines.push('适用场景：' + entry.when)
    lines.push(entry.content)
    return lines.join('\n')
  }

    function demoPlan() {
    var budget = DEMO_STORE.budgetChars
    if (typeof budget !== 'number' || !isFinite(budget)) budget = 4000
    if (budget < 800) budget = 800
    if (budget > 40000) budget = 40000
    var blank = function () {
      return { text: '', budget: budget, activeCount: 0, included: [], omitted: [], profiles: [], profileChars: 0, entryChars: 0 }
    }
    if (DEMO_STORE.enabled !== true) return blank()
    // F7 临时静音：与真实宿主同义——暂停中的计划与 enabled:false 逐字节相同。
    if (typeof DEMO_STORE.disabledUntil === 'number' && DEMO_STORE.disabledUntil > Date.now()) return blank()
    var persona = demoProfilesBlock()
    var active = demoScopedEntries().filter(function (e) { return e.enabled && e.content !== '' })

    var blocks = []
    var included = []
    var omittedPlan = []
    var used = DEMO_HEADER.length
    var omitted = 0

    function consider(entry, tag) {
      var block = demoFormatEntry(entry, tag)
      var reserve = demoFooter(omitted + 1).length
      if (used + block.length + 2 + reserve <= budget) {
        used += block.length + 2
        blocks.push(block)
        included.push({ id: entry.id, chars: block.length, truncated: false })
        return
      }
      if (blocks.length === 0) {
        var room = budget - used - 2 - reserve
        var note = '\n…（本条因注入字数上限被截断）'
        if (room > note.length + 20) {
          var head = block.slice(0, room - note.length)
          var body = head + note
          blocks.push(body)
          used += body.length + 2
          included.push({ id: entry.id, chars: body.length, truncated: true })
          return
        }
      }
      omitted += 1
      omittedPlan.push({ id: entry.id, chars: block.length })
    }

    active.forEach(function (entry) { if (entry.mode === 'always') consider(entry, '始终') })
    active.forEach(function (entry) { if (entry.mode !== 'always') consider(entry, '按需') })

    var entryText = blocks.length === 0
      ? ''
      : DEMO_HEADER + blocks.join('\n\n') + demoFooter(omitted)
    var parts = []
    if (persona.text !== '') parts.push(persona.text)
    if (entryText !== '') parts.push(entryText)
    return {
      text: parts.join('\n\n'),
      budget: budget,
      activeCount: active.length,
      included: included,
      omitted: omittedPlan,
      profiles: persona.profiles,
      profileChars: persona.chars,
      entryChars: entryText.length,
    }
  }

  /** Where a fresh set id comes from (mirrors the Host's st- prefix). */
  function demoSetId() {
    return 'st-demo-' + Math.random().toString(36).slice(2, 8)
  }

  function demoSnapshot() {
    var plan = demoPlan()
    // The panel edits and lists ONLY the active set (exactly like the real
    // Host's snapshot), so a demo switch really empties the list.
    var full = JSON.parse(JSON.stringify(DEMO_STORE))
    var data = full
    data.entries = demoScopedEntries().map(function (e) { return JSON.parse(JSON.stringify(e)) })
    data.profiles = demoScopedProfiles().map(function (p) { return JSON.parse(JSON.stringify(p)) })
    var belongsTo = function (item, id) {
      var own = item && typeof item.setId === 'string' && item.setId !== '' ? item.setId : DEMO_STORE.activeSetId
      return own === id
    }
    var setList = (DEMO_STORE.sets || []).map(function (s) {
      return {
        id: s.id,
        name: s.name,
        active: s.id === DEMO_STORE.activeSetId,
        entries: (DEMO_STORE.entries || []).filter(function (e) { return belongsTo(e, s.id) }).length,
        profiles: (DEMO_STORE.profiles || []).filter(function (p) { return belongsTo(p, s.id) }).length,
      }
    })
    return {
      data: data,
      sets: {
        activeId: DEMO_STORE.activeSetId,
        scoped: true,
        total: { entries: full.entries.length, profiles: full.profiles.length },
        list: setList,
      },
      storage: {
        // The store file NEVER moves with the backup location — only the
        // backup copies do (same rule as the real host).
        path: 'C:\\Users\\demo\\.dsh\\instruction-memory\\memory.json',
        error: null,
        warning: null,
        savedAt: Date.now() - 5 * 60000,
        migratedFrom: null,
        onDisk: true,
        backupDir: DEMO_STORE.backupDir || '',
        isDefaultBackupDir: !DEMO_STORE.backupDir,
        backupPath: (DEMO_STORE.backupDir || 'C:\\Users\\demo\\.dsh\\instruction-memory') + '\\memory.json.bak',
        historyDir: (DEMO_STORE.backupDir || 'C:\\Users\\demo\\.dsh\\instruction-memory') + '\\history',
        historyCount: 0,
        historyError: null,
        schemaFile: 'C:\\Users\\demo\\.dsh\\instruction-memory\\memory.schema.json',
      },
      injection: {
        registered: plan.text !== '',
        available: true,
        error: null,
        muted: DEMO_STORE.enabled === true && typeof DEMO_STORE.disabledUntil === 'number' && DEMO_STORE.disabledUntil > Date.now(),
        chars: plan.text.length,
        budget: plan.budget,
        activeCount: plan.activeCount,
        included: plan.included,
        omitted: plan.omitted,
        profiles: plan.profiles,
        profileChars: plan.profileChars,
        entryChars: plan.entryChars,
        pulls: 2,
      },
      // F12：演示桩里路由绑定在回环地址，安全面板不告警。
      security: { hostGuarded: true, boundHost: '127.0.0.1' },
      diagnostics: { loadedFrom: 'demo（内存桩宿主）', rev: data.rev || 0 },
      preview: plan.text,
      limits: {
        minBudget: 800, maxBudget: 40000, maxEntries: 200,
        maxProfiles: 50, maxProfileName: 40, maxProfileContent: 4000,
        maxSets: 20, maxSetName: 30, maxHistory: 20, maxBackupDir: 512,
        maxBodyChars: 3218000,
      },
    }
  }

  /** A no-op answer: ok, nothing written (mirrors the real envelope). */
  function demoNoop() {
    return {
      ok: true,
      json: async function () {
        return { ok: true, saved: false, message: null, snapshot: demoSnapshot() }
      },
    }
  }

  /** Uniform route envelope for the demo host (the real one answers the same shape). */
  function demoReply(ok, message) {
    return {
      ok: true,
      json: async function () {
        return {
          ok: ok === true,
          saved: ok === true,
          message: message === undefined ? null : message,
          snapshot: demoSnapshot(),
        }
      },
    }
  }

  /**
   * Adopt a whole store object (源码模式 / 整体替换). Mirrors the parts of the
   * Host's loader a demo needs to stay believable: sets are kept, every item is
   * stamped onto an existing set, missing ids are minted.
   */
  function demoAdoptStore(parsed) {
    DEMO_STORE.version = 2
    DEMO_STORE.enabled = parsed.enabled !== false
    DEMO_STORE.disabledUntil = typeof parsed.disabledUntil === 'number' && isFinite(parsed.disabledUntil) && parsed.disabledUntil > 0
      ? parsed.disabledUntil
      : 0
    DEMO_STORE.budgetChars = typeof parsed.budgetChars === 'number' ? parsed.budgetChars : 4000
    DEMO_STORE.sets = Array.isArray(parsed.sets) && parsed.sets.length > 0
      ? parsed.sets.map(function (s) { return { id: String(s.id), name: String(s.name).slice(0, 30) } })
      : [{ id: 'st-demo-default', name: '默认' }]
    DEMO_STORE.activeSetId = DEMO_STORE.sets.some(function (s) { return s.id === parsed.activeSetId })
      ? parsed.activeSetId
      : DEMO_STORE.sets[0].id
    DEMO_STORE.entries = (Array.isArray(parsed.entries) ? parsed.entries : []).map(function (e) {
      var entry = JSON.parse(JSON.stringify(e))
      entry.id = entry.id || ('im-demo-' + Math.random().toString(36).slice(2, 8))
      entry.setId = DEMO_STORE.sets.some(function (s) { return s.id === entry.setId })
        ? entry.setId
        : DEMO_STORE.activeSetId
      entry.tags = Array.isArray(entry.tags) ? entry.tags : []
      return entry
    })
    DEMO_STORE.profiles = (Array.isArray(parsed.profiles) ? parsed.profiles : []).map(function (p) {
      var profile = JSON.parse(JSON.stringify(p))
      profile.id = profile.id || ('pf-demo-' + Math.random().toString(36).slice(2, 8))
      profile.setId = DEMO_STORE.sets.some(function (s) { return s.id === profile.setId })
        ? profile.setId
        : DEMO_STORE.activeSetId
      return profile
    })
  }

  window.fetch = async function (url, options) {
    var payload = JSON.parse(options.body)
    switch (payload.method) {
      case 'save-entry': {
        var entry = Object.assign({}, payload.args.entry)
        if (!entry.id) entry.id = 'im-demo-' + Math.random().toString(36).slice(2, 8)
        entry.updatedAt = Date.now()
        // The interactive path always files into the ACTIVE set (same rule as
        // the real Host — an edit can never move an item between sets), and an
        // id owned by another set is re-minted rather than replaced.
        entry.setId = DEMO_STORE.activeSetId
        var foreignId = DEMO_STORE.entries.some(function (e) {
          return e.id === entry.id && e.setId !== DEMO_STORE.activeSetId
        })
        if (foreignId) entry.id = 'im-demo-' + Math.random().toString(36).slice(2, 8)
        var list = DEMO_STORE.entries
        var index = -1
        for (var i = 0; i < list.length; i += 1) if (list[i].id === entry.id) { index = i; break }
        if (index >= 0) list[index] = entry
        else list.push(entry)
        break
      }
      case 'delete-entry': {
        var doomed = payload.args.id
        var owned = DEMO_STORE.entries.some(function (e) {
          return e.id === doomed && demoInScope(e)
        })
        if (!owned) return demoNoop()
        DEMO_STORE.entries = DEMO_STORE.entries.filter(function (e) { return e.id !== doomed })
        break
      }
      case 'set-options': {
        if (typeof payload.args.enabled === 'boolean') {
          DEMO_STORE.enabled = payload.args.enabled
          DEMO_STORE.disabledUntil = 0
        }
        if (typeof payload.args.disabledUntil === 'number' && isFinite(payload.args.disabledUntil)
          && payload.args.disabledUntil >= 0 && typeof payload.args.enabled !== 'boolean') {
          var wantedMute = Math.round(payload.args.disabledUntil)
          var muteClamped = false
          if (wantedMute <= Date.now()) wantedMute = 0
          else if (wantedMute > Date.now() + 7 * 86400000) { wantedMute = Date.now() + 7 * 86400000; muteClamped = true }
          DEMO_STORE.disabledUntil = wantedMute
          if (wantedMute > 0) {
            // 演示桩也到期自动恢复：真实宿主由插件内的定时器负责，这里用一个页内
            // 定时器模拟同一行为（下一个快照即恢复正常态）。
            setTimeout(function () { DEMO_STORE.disabledUntil = 0 }, wantedMute - Date.now() + 50)
          }
          return demoReply(true, wantedMute === 0
            ? '已恢复注入。'
            : '已暂停注入至 ' + new Date(wantedMute).toLocaleString() + '（到期自动恢复；暂停期间不注入任何指令或用户形象）'
              + (muteClamped ? '；暂停时长上限为 7 天，已按上限记录' : ''))
        }
        if (typeof payload.args.budgetChars === 'number') DEMO_STORE.budgetChars = payload.args.budgetChars
        if (typeof payload.args.backupDir === 'string') {
          DEMO_STORE.backupDir = payload.args.backupDir.trim()
          return demoReply(true, DEMO_STORE.backupDir === ''
            ? '已恢复默认备份位置（版本历史与导出与存储文件同目录）'
            : '备份位置已更新：' + DEMO_STORE.backupDir + '（版本历史与「导出到备份目录」随之改变；存储文件本身不移动）')
        }
        break
      }
      case 'batch': {
        // Demo stand-in for the Host's single-transaction batch route.
        var b = payload.args || {}
        var batchIds = Array.isArray(b.ids) ? b.ids : []
        if (b.op === 'delete') {
          DEMO_STORE.entries = DEMO_STORE.entries.filter(function (e) {
            return batchIds.indexOf(e.id) < 0
          })
        } else {
          DEMO_STORE.entries.forEach(function (e) {
            if (batchIds.indexOf(e.id) < 0) return
            if (b.op === 'set-enabled') {
              e.enabled = b.value
            } else if (b.op === 'set-priority') {
              e.priority = b.value
            } else if (b.op === 'add-tags') {
              var cur = Array.isArray(e.tags) ? e.tags.slice() : []
              ;(b.value || []).forEach(function (tg) { if (cur.indexOf(tg) < 0) cur.push(tg) })
              e.tags = cur.slice(0, 8)
            } else if (b.op === 'remove-tags') {
              e.tags = (e.tags || []).filter(function (tg) { return (b.value || []).indexOf(tg) < 0 })
            }
          })
        }
        break
      }
      case 'save-profile': {
        // Demo stand-in for the Host's save-profile route. Mirror
        // sanitizeProfile: a blank name falls back to the first 20 single-line
        // characters of content, so the card never shows an empty name (the
        // real Host stores this fallback; it is not a client-only label).
        var p = Object.assign({}, payload.args.profile)
        if (!p.id) p.id = 'pf-demo-' + Math.random().toString(36).slice(2, 8)
        if (typeof p.enabled !== 'boolean') p.enabled = true
        if (typeof p.content !== 'string') p.content = ''
        var oneLine = function (s, max) {
          return String(s).split(/\r?\n/).map(function (x) { return x.trim() })
            .filter(Boolean).join(' ').slice(0, max)
        }
        var trimmedName = oneLine(p.name || '', 40)
        p.name = trimmedName !== '' ? trimmedName : oneLine(p.content, 20)
        p.updatedAt = Date.now()
        if (!Array.isArray(DEMO_STORE.profiles)) DEMO_STORE.profiles = []
        var pIndex = -1
        for (var pi = 0; pi < DEMO_STORE.profiles.length; pi += 1) {
          if (DEMO_STORE.profiles[pi].id === p.id) { pIndex = pi; break }
        }
        if (pIndex >= 0) DEMO_STORE.profiles[pIndex] = p
        else DEMO_STORE.profiles.push(p)
        break
      }
      case 'delete-profile':
        DEMO_STORE.profiles = (DEMO_STORE.profiles || [])
          .filter(function (p) { return p.id !== payload.args.id })
        break
      // ---- F13 配置集 ----
      case 'save-set': {
        var wanted = Object.assign({}, payload.args.set)
        var wantedName = typeof wanted.name === 'string'
          ? wanted.name.split(/\r?\n/).join(' ').trim().slice(0, 30)
          : ''
        if (wantedName === '') return demoReply(false, '配置集名称不能为空（单行，最多 30 字符）')
        var sameName = function (s) { return s.name === wantedName && s.id !== wanted.id }
        if (DEMO_STORE.sets.some(sameName)) return demoReply(false, '已存在同名配置集「' + wantedName + '」')
        if (!wanted.id) {
          if (DEMO_STORE.sets.length >= 20) return demoReply(false, '最多创建 20 个配置集')
          DEMO_STORE.sets.push({ id: demoSetId(), name: wantedName })
          return demoReply(true, '已创建配置集「' + wantedName + '」；它是空的，点击「切换」后才会注入它')
        }
        var renameAt = -1
        for (var si = 0; si < DEMO_STORE.sets.length; si += 1) {
          if (DEMO_STORE.sets[si].id === wanted.id) { renameAt = si; break }
        }
        if (renameAt < 0) return demoReply(false, '没有该配置集（可能已被其他窗口删除）')
        DEMO_STORE.sets[renameAt].name = wantedName
        return demoReply(true, '已重命名为「' + wantedName + '」')
      }
      case 'delete-set': {
        var deleteId = payload.args.id
        var targetSet = null
        DEMO_STORE.sets.forEach(function (s) { if (s.id === deleteId) targetSet = s })
        if (targetSet === null) return demoReply(false, '没有该配置集')
        if (DEMO_STORE.sets.length <= 1) return demoReply(false, '至少要保留一个配置集')
        if (deleteId === DEMO_STORE.activeSetId) return demoReply(false, '不能删除当前激活的配置集；请先切换到其他配置集')
        DEMO_STORE.sets = DEMO_STORE.sets.filter(function (s) { return s.id !== deleteId })
        DEMO_STORE.entries = DEMO_STORE.entries.filter(function (e) { return e.setId !== deleteId })
        DEMO_STORE.profiles = (DEMO_STORE.profiles || []).filter(function (p) { return p.setId !== deleteId })
        return demoReply(true, '已删除配置集「' + targetSet.name + '」及其中的条目与形象')
      }
      case 'set-active-set': {
        var activeId = payload.args.id
        var found = DEMO_STORE.sets.some(function (s) { return s.id === activeId })
        if (!found) return demoReply(false, '没有该配置集（可能已被其他窗口删除）')
        if (activeId === DEMO_STORE.activeSetId) return demoNoop()
        DEMO_STORE.activeSetId = activeId
        var activeName = ''
        DEMO_STORE.sets.forEach(function (s) { if (s.id === activeId) activeName = s.name })
        return demoReply(true, '已切换到配置集「' + activeName + '」，注入内容已随之更新')
      }
      case 'duplicate-set': {
        var copyFrom = null
        DEMO_STORE.sets.forEach(function (s) { if (s.id === payload.args.id) copyFrom = s })
        if (copyFrom === null) return demoReply(false, '没有该配置集')
        if (DEMO_STORE.sets.length >= 20) return demoReply(false, '最多 20 个配置集')
        var copyName = (payload.args.name || copyFrom.name + ' 副本').trim().slice(0, 30)
        if (DEMO_STORE.sets.some(function (s) { return s.name === copyName })) return demoReply(false, '已存在同名配置集「' + copyName + '」')
        var copyId = demoSetId()
        var stamp = Date.now()
        var copiedEntries = DEMO_STORE.entries.filter(function (e) { return e.setId === copyFrom.id })
          .map(function (e) {
            var copy = JSON.parse(JSON.stringify(e))
            copy.id = 'im-demo-' + Math.random().toString(36).slice(2, 8)
            copy.setId = copyId
            copy.updatedAt = stamp
            return copy
          })
        DEMO_STORE.sets.push({ id: copyId, name: copyName })
        Array.prototype.push.apply(DEMO_STORE.entries, copiedEntries)
        return demoReply(true, '已复制为「' + copyName + '」（' + copiedEntries.length + ' 条指令）；点击「切换」后才会注入它')
      }
      // ---- F14 版本历史（演示页面不落盘，因此没有快照可列） ----
      case 'history-list':
        return {
          ok: true,
          json: async function () {
            return {
              ok: true, saved: false, message: null, snapshot: demoSnapshot(),
              history: { dir: '（演示页面不写历史快照；真实宿主会在存储目录的 history/ 子目录里保留最近 20 份）', items: [] },
            }
          },
        }
      case 'history-restore':
      case 'history-delete':
        return demoReply(false, '演示页面没有历史快照')
      // ---- F16 源码模式 ----
      case 'read-source':
        return {
          ok: true,
          json: async function () {
            return { ok: true, saved: false, message: null, source: JSON.stringify(DEMO_STORE, null, 2) + '\n', snapshot: demoSnapshot() }
          },
        }
      case 'write-source': {
        var text = payload.args.text
        if (typeof text !== 'string' || text.trim() === '') return demoReply(false, '源码不能为空')
        var parsedSource = null
        try {
          parsedSource = JSON.parse(text)
        } catch (err) {
          return demoReply(false, '源码不是有效的 JSON：' + (err && err.message ? err.message : err))
        }
        if (parsedSource === null || typeof parsedSource !== 'object' || Array.isArray(parsedSource)) {
          return demoReply(false, '顶层必须是一个 JSON 对象')
        }
        if (typeof parsedSource.version === 'number' && parsedSource.version !== 2) {
          return demoReply(false, '内容声明为格式版本 ' + parsedSource.version + '，本插件支持的格式版本为 1 / 2')
        }
        demoAdoptStore(parsedSource)
        return demoReply(true, '已按源码保存（演示页面只改内存，不写文件）：'
          + DEMO_STORE.entries.length + ' 条指令 / ' + (DEMO_STORE.profiles || []).length + ' 个用户形象 / '
          + DEMO_STORE.sets.length + ' 个配置集')
      }
      // ---- F14 整体替换恢复 ----
      case 'restore-data': {
        var restorePayload = payload.args.payload
        if (restorePayload === null || typeof restorePayload !== 'object') return demoReply(false, '恢复内容不是有效的 JSON 对象')
        var restoreInner = restorePayload.data !== null && typeof restorePayload.data === 'object' ? restorePayload.data : restorePayload
        var looksLikeStore = ['version', 'enabled', 'budgetChars', 'activeSetId', 'sets', 'entries', 'profiles']
          .some(function (key) { return key in restoreInner })
        if (!looksLikeStore) return demoReply(false, '内容不像本插件的存储文件')
        demoAdoptStore(restoreInner)
        return demoReply(true, '已用备份整体替换当前记忆（演示页面只改内存，不写文件）')
      }
      // ---- F18 备份位置 ----
      case 'export-to-dir':
        return demoReply(true, '演示页面不会真的写文件；真实宿主会把导出写入「'
          + (DEMO_STORE.backupDir || '存储目录') + '」，文件名形如 dsh-instruction-memory-20261015-152355Z.json')
      case 'export-data':
        return {
          ok: true,
          json: async function () {
            return {
              ok: true, saved: false, message: null,
              // 导出的是整份存储（所有配置集），不是当前激活的那一套。
              export: { app: 'dsh-instruction-memory', version: 2, exportedAt: new Date().toISOString(), data: JSON.parse(JSON.stringify(DEMO_STORE)) },
              snapshot: demoSnapshot(),
            }
          },
        }
      default:
        break
    }
    return {
      ok: true,
      json: async function () {
        return { ok: true, saved: true, message: null, snapshot: demoSnapshot() }
      },
    }
  }
</script>

<!-- The real client module, unmodified. -->
<script src="../lib/client.js"></script>

<script>
  var plugin = window.__dshSpec.factory(function (id) {
    if (id === 'react') return window.React
    throw new Error('unexpected require: ' + id)
  })

  var registered = []
  plugin.apply({
    slots: {
      inject: function (key, callback) { callback(); return function () {} },
      register: function (options, render) { registered.push(render); return function () {} },
    },
    effect: function (fn) { fn(); return function () {} },
  })

  ReactDOM.createRoot(document.getElementById('root')).render(registered[0]())
</script>
