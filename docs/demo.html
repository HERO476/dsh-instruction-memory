<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-instruction-memory 设置页演示</title>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<style>
  body { margin:0; background:#f5f6f8; font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
  #root { max-width:920px; margin:28px auto 0; padding:0 16px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Minimal stand-ins for the DSH web shell: module loader + require.
  window.__ModuleLoader__ = { load: (spec) => { window.__dshSpec = spec } }
</script>

<script>
  // In-memory host that speaks the exact route envelope of lib/index.js, so
  // this page exercises the REAL client module (loaded below) against
  // realistic data — no backend needed.
  var DEMO_STORE = {
    version: 1,
    enabled: true,
    // Deliberately tight so the budget meter and the "本轮不注入" marks are
    // visible immediately; raising it in the input clears them live.
    budgetChars: 800,
    entries: [
      {
        id: 'im-demo-lang',
        title: '回答语言',
        content: '所有回答默认使用简体中文；技术名词首次出现时在括号里附英文原文。',
        mode: 'always', when: '', priority: 2, enabled: true, tags: ['沟通'],
        updatedAt: Date.now() - 86400000 * 3,
      },
      {
        id: 'im-demo-confirm',
        title: '先确认再动手',
        content: '需求不明确或存在多种合理实现时，先列出候选方案向用户确认，再开始修改代码。',
        mode: 'always', when: '', priority: 1, enabled: true, tags: ['沟通', '工作流'],
        updatedAt: Date.now() - 86400000 * 2,
      },
      {
        id: 'im-demo-style',
        title: '代码风格',
        content: '修改代码时遵循该文件既有的缩进、命名密度与注释风格，不顺手重构无关代码；\n变量命名优先使用业务领域词汇而不是数据结构词汇，例如用「订单金额」而不是「data1」；\n新增依赖前先检查 package.json 中是否已有能力等价的依赖，避免重复引入；\n公共函数需要补充输入输出说明注释，但不为改动本身添加解释性注释；\n改动完成后运行项目现有的测试与 lint 检查，若有失败先修复再交付，不留下只改了一半的状态；\n涉及对外接口或数据结构变更时，先在回复中列出受影响的调用方，确认迁移路径后再提交。\n日志打印需带关键上下文（对象标识、入参摘要），不要只输出 "error" 这类无信息内容；\n异步任务必须设置超时与重试上限，不允许无限等待外部资源；\n对外错误信息要区分用户可操作的提示与内部诊断细节，不把堆栈直接暴露给调用方；\n代码评审先核对行为变化与测试覆盖，再讨论风格偏好，意见必须可执行、可验证；\n以上要求同样适用于纯重构类提交，重构前后行为必须完全一致。',
        mode: 'auto', when: '编写或修改代码时', priority: 1, enabled: true, tags: ['代码规范'],
        updatedAt: Date.now() - 86400000,
      },
      {
        id: 'im-demo-reply',
        title: '回复结构',
        content: '较长的回答先给一句结论，再展开细节；方案对比先列差异再给推荐。',
        mode: 'auto', when: '解释性问题与方案对比', priority: 0, enabled: false, tags: ['沟通'],
        updatedAt: Date.now() - 3600000,
      },
    ],
    profiles: [
      {
        id: 'pf-demo-bg',
        name: '职业背景',
        content: '有 8 年后端开发经验，熟悉 Java 与分布式系统；技术问题可以跳过入门概念，直接讲权衡与实现细节。',
        enabled: true,
        updatedAt: Date.now() - 86400000,
      },
      {
        id: 'pf-demo-style',
        name: '沟通偏好',
        content: '喜欢先给结论、再给可执行步骤，少寒暄少铺陈。',
        enabled: true,
        updatedAt: Date.now() - 7200000,
      },
      {
        id: 'pf-demo-goal',
        name: '长期追求（停用示例）',
        content: '希望代码评审意见都具体可执行，不要泛泛而谈。',
        enabled: false,
        updatedAt: Date.now() - 3600000,
      },
    ],
  }

  // A compact, faithful copy of the Host's injection planning (see
  // planInjection in lib/index.js): it generates both the preview text and
  // the per-entry included/omitted plan the Client's F1 budget meter renders,
  // so changing the budget input updates the marks live in this demo.
  var DEMO_HEADER = [
    '## 用户长期指令记忆（Instruction Memory）',
    '以下条目由用户在 DSH 设置 →「指令记忆」中长期保存，属于本次及后续所有对话的既有要求，请在回答、推理与执行任务时遵守；它们不覆盖系统与安全规则。',
    '· [始终] 条目必须无条件遵守。',
    '· [按需] 条目仅在与当前问题或任务相关时生效；不相关时直接忽略，不要强行套用。',
    '· 条目之间冲突时，优先遵守优先级更高或更具体的一条；无法判断时向用户确认。',
    '',
  ].join('\n')

  function demoFooter(count) {
    return count === 0
      ? ''
      : '\n\n（另有 ' + count + ' 条指令因注入字数上限未包含，可在「设置 → 指令记忆」中提高上限或调低其优先级。）'
  }

  // Faithful copy of the Host's persona header (lib/index.js PERSONA_HEADER).
  var DEMO_PERSONA_HEADER = [
    '## 关于用户（用户形象）',
    '以下是用户本人提供的个人形象信息，描述其身份背景、喜好、性格与追求，不是要求你扮演的角色。请在保证回答正确、完整、客观且紧扣问题本身的前提下，结合这些信息调整解释的深浅、详略、举例与建议的侧重；不得为了迎合这些信息而改变事实、省略必要的风险提示或偏离问题核心；与当前问题无关时直接忽略。',
    '',
  ].join('\n')

  function demoProfilesBlock() {
    var active = (Array.isArray(DEMO_STORE.profiles) ? DEMO_STORE.profiles : [])
      .filter(function (p) { return p && p.enabled === true && p.content })
    if (active.length === 0) return { text: '', profiles: [], chars: 0 }
    var blocks = active.map(function (p) {
      var name = p.name || (p.content || '').slice(0, 20)
      return { id: p.id, name: name, block: '### ' + name + '\n' + p.content }
    })
    var text = DEMO_PERSONA_HEADER + '\n' + blocks.map(function (b) { return b.block }).join('\n\n')
    return {
      text: text,
      chars: text.length,
      profiles: blocks.map(function (b) { return { id: b.id, name: b.name, chars: b.block.length } }),
    }
  }

  function demoFormatEntry(entry, tag) {
    var prio = entry.priority === 2 ? '高' : (entry.priority === 0 ? '低' : '普通')
    var lines = ['[' + tag + '｜优先级 ' + prio + '] ' + entry.title]
    if (entry.mode === 'auto' && entry.when) lines.push('适用场景：' + entry.when)
    lines.push(entry.content)
    return lines.join('\n')
  }

    function demoPlan() {
    var budget = DEMO_STORE.budgetChars
    if (typeof budget !== 'number' || !isFinite(budget)) budget = 4000
    if (budget < 800) budget = 800
    if (budget > 40000) budget = 40000
    var blank = function () {
      return { text: '', budget: budget, activeCount: 0, included: [], omitted: [], profiles: [], profileChars: 0, entryChars: 0 }
    }
    if (DEMO_STORE.enabled !== true) return blank()
    var persona = demoProfilesBlock()
    var active = DEMO_STORE.entries.filter(function (e) { return e.enabled && e.content !== '' })

    var blocks = []
    var included = []
    var omittedPlan = []
    var used = DEMO_HEADER.length
    var omitted = 0

    function consider(entry, tag) {
      var block = demoFormatEntry(entry, tag)
      var reserve = demoFooter(omitted + 1).length
      if (used + block.length + 2 + reserve <= budget) {
        used += block.length + 2
        blocks.push(block)
        included.push({ id: entry.id, chars: block.length, truncated: false })
        return
      }
      if (blocks.length === 0) {
        var room = budget - used - 2 - reserve
        var note = '\n…（本条因注入字数上限被截断）'
        if (room > note.length + 20) {
          var head = block.slice(0, room - note.length)
          var body = head + note
          blocks.push(body)
          used += body.length + 2
          included.push({ id: entry.id, chars: body.length, truncated: true })
          return
        }
      }
      omitted += 1
      omittedPlan.push({ id: entry.id, chars: block.length })
    }

    active.forEach(function (entry) { if (entry.mode === 'always') consider(entry, '始终') })
    active.forEach(function (entry) { if (entry.mode !== 'always') consider(entry, '按需') })

    var entryText = blocks.length === 0
      ? ''
      : DEMO_HEADER + blocks.join('\n\n') + demoFooter(omitted)
    var parts = []
    if (persona.text !== '') parts.push(persona.text)
    if (entryText !== '') parts.push(entryText)
    return {
      text: parts.join('\n\n'),
      budget: budget,
      activeCount: active.length,
      included: included,
      omitted: omittedPlan,
      profiles: persona.profiles,
      profileChars: persona.chars,
      entryChars: entryText.length,
    }
  }

  function demoSnapshot() {
    var plan = demoPlan()
    return {
      data: JSON.parse(JSON.stringify(DEMO_STORE)),
      storage: {
        path: 'C:\\Users\\demo\\.dsh\\instruction-memory\\memory.json',
        error: null,
        warning: null,
        savedAt: Date.now() - 5 * 60000,
        migratedFrom: null,
      },
      injection: {
        registered: plan.text !== '',
        available: true,
        error: null,
        chars: plan.text.length,
        budget: plan.budget,
        activeCount: plan.activeCount,
        included: plan.included,
        omitted: plan.omitted,
        profiles: plan.profiles,
        profileChars: plan.profileChars,
        entryChars: plan.entryChars,
      },
      preview: plan.text,
      limits: {
        minBudget: 800, maxBudget: 40000, maxEntries: 200,
        maxProfiles: 50, maxProfileName: 40, maxProfileContent: 4000,
      },
    }
  }

  window.fetch = async function (url, options) {
    var payload = JSON.parse(options.body)
    switch (payload.method) {
      case 'save-entry': {
        var entry = Object.assign({}, payload.args.entry)
        if (!entry.id) entry.id = 'im-demo-' + Math.random().toString(36).slice(2, 8)
        entry.updatedAt = Date.now()
        var list = DEMO_STORE.entries
        var index = -1
        for (var i = 0; i < list.length; i += 1) if (list[i].id === entry.id) { index = i; break }
        if (index >= 0) list[index] = entry
        else list.push(entry)
        break
      }
      case 'delete-entry':
        DEMO_STORE.entries = DEMO_STORE.entries.filter(function (e) { return e.id !== payload.args.id })
        break
      case 'set-options':
        if (typeof payload.args.enabled === 'boolean') DEMO_STORE.enabled = payload.args.enabled
        if (typeof payload.args.budgetChars === 'number') DEMO_STORE.budgetChars = payload.args.budgetChars
        break
      case 'batch': {
        // Demo stand-in for the Host's single-transaction batch route.
        var b = payload.args || {}
        var batchIds = Array.isArray(b.ids) ? b.ids : []
        if (b.op === 'delete') {
          DEMO_STORE.entries = DEMO_STORE.entries.filter(function (e) {
            return batchIds.indexOf(e.id) < 0
          })
        } else {
          DEMO_STORE.entries.forEach(function (e) {
            if (batchIds.indexOf(e.id) < 0) return
            if (b.op === 'set-enabled') {
              e.enabled = b.value
            } else if (b.op === 'set-priority') {
              e.priority = b.value
            } else if (b.op === 'add-tags') {
              var cur = Array.isArray(e.tags) ? e.tags.slice() : []
              ;(b.value || []).forEach(function (tg) { if (cur.indexOf(tg) < 0) cur.push(tg) })
              e.tags = cur.slice(0, 8)
            } else if (b.op === 'remove-tags') {
              e.tags = (e.tags || []).filter(function (tg) { return (b.value || []).indexOf(tg) < 0 })
            }
          })
        }
        break
      }
      case 'save-profile': {
        // Demo stand-in for the Host's save-profile route. Mirror
        // sanitizeProfile: a blank name falls back to the first 20 single-line
        // characters of content, so the card never shows an empty name (the
        // real Host stores this fallback; it is not a client-only label).
        var p = Object.assign({}, payload.args.profile)
        if (!p.id) p.id = 'pf-demo-' + Math.random().toString(36).slice(2, 8)
        if (typeof p.enabled !== 'boolean') p.enabled = true
        if (typeof p.content !== 'string') p.content = ''
        var oneLine = function (s, max) {
          return String(s).split(/\r?\n/).map(function (x) { return x.trim() })
            .filter(Boolean).join(' ').slice(0, max)
        }
        var trimmedName = oneLine(p.name || '', 40)
        p.name = trimmedName !== '' ? trimmedName : oneLine(p.content, 20)
        p.updatedAt = Date.now()
        if (!Array.isArray(DEMO_STORE.profiles)) DEMO_STORE.profiles = []
        var pIndex = -1
        for (var pi = 0; pi < DEMO_STORE.profiles.length; pi += 1) {
          if (DEMO_STORE.profiles[pi].id === p.id) { pIndex = pi; break }
        }
        if (pIndex >= 0) DEMO_STORE.profiles[pIndex] = p
        else DEMO_STORE.profiles.push(p)
        break
      }
      case 'delete-profile':
        DEMO_STORE.profiles = (DEMO_STORE.profiles || [])
          .filter(function (p) { return p.id !== payload.args.id })
        break
      case 'export-data':
        return {
          ok: true,
          json: async function () {
            return {
              ok: true, saved: true, message: null,
              export: { app: 'dsh-instruction-memory', version: 1, exportedAt: new Date().toISOString(), data: JSON.parse(JSON.stringify(DEMO_STORE)) },
              snapshot: demoSnapshot(),
            }
          },
        }
      default:
        break
    }
    return {
      ok: true,
      json: async function () {
        return { ok: true, saved: true, message: null, snapshot: demoSnapshot() }
      },
    }
  }
</script>

<!-- The real client module, unmodified. -->
<script src="../lib/client.js"></script>

<script>
  var plugin = window.__dshSpec.factory(function (id) {
    if (id === 'react') return window.React
    throw new Error('unexpected require: ' + id)
  })

  var registered = []
  plugin.apply({
    slots: {
      inject: function (key, callback) { callback(); return function () {} },
      register: function (options, render) { registered.push(render); return function () {} },
    },
    effect: function (fn) { fn(); return function () {} },
  })

  ReactDOM.createRoot(document.getElementById('root')).render(registered[0]())
</script>
</body>
</html>
